services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./configs:/app/configs:ro
      - ./datasets:/app/datasets:ro
      - lab_data:/app/data
    env_file:
      - .env
    environment:
      - LAB_DATA_DIR=/app/data
      # Reach host-machine Ollama from inside the container.
      # host.docker.internal resolves to the Docker host on Linux/Mac/Windows.
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  ui:
    build:
      context: ./ui
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  lab_data:
