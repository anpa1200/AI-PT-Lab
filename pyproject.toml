[project]
name = "vulnerable-ai-lab"
version = "0.1.0"
description = "Intentionally vulnerable AI security training lab"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "PyYAML>=6.0",
    "chromadb>=0.6",
    "openai>=1.50",
    "anthropic>=0.40",
    "google-generativeai>=0.8",
    "httpx>=0.27",
    "typer[all]>=0.15",
    "rich>=14.0",
    "aiosqlite>=0.20",
    "sentence-transformers>=3.0",
    "jinja2>=3.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "ruff>=0.8",
    "mypy>=1.13",
]

[project.scripts]
vai-lab = "app.cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = false
ignore_missing_imports = true
